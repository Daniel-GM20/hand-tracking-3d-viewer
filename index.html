<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S — Exploded View</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #04070d; }
      body { font-family: 'Segoe UI', system-ui, sans-serif; color: #9fdcff; }
      #app { position: relative; width: 100%; height: 100%; }
      #scene-canvas { position: absolute; inset: 0; display: block; }

      /* Video preview (esquina inferior derecha) */
      #video-preview {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 240px;
        height: 180px;
        border: 1px solid rgba(0, 200, 255, 0.45);
        border-radius: 8px;
        box-shadow: 0 0 18px rgba(0, 180, 255, 0.25);
        background: #000;
        z-index: 10;
        transform: scaleX(-1); /* espejo */
      }
      #webcam { display: none; }

      /* HUD */
      #hud {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 10;
        pointer-events: none;
        user-select: none;
      }
      #hud .panel {
        background: rgba(4, 12, 24, 0.65);
        border: 1px solid rgba(0, 200, 255, 0.35);
        border-radius: 8px;
        padding: 12px 16px;
        min-width: 260px;
        backdrop-filter: blur(6px);
        box-shadow: 0 0 18px rgba(0, 180, 255, 0.15);
      }
      #hud h1 {
        font-size: 14px;
        letter-spacing: 3px;
        font-weight: 600;
        color: #6ee7ff;
        margin-bottom: 8px;
        text-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
      }
      #hud .row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; letter-spacing: 1px; }
      #hud .value { color: #e6fbff; }
      #hud .value.ok { color: #4dffb8; text-shadow: 0 0 6px rgba(77, 255, 184, 0.6); }
      #hud .value.active { color: #ffd34d; text-shadow: 0 0 6px rgba(255, 211, 77, 0.6); }

      #explosion-bar {
        margin-top: 10px;
        height: 6px;
        border-radius: 3px;
        background: rgba(0, 120, 180, 0.25);
        overflow: hidden;
      }
      #explosion-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00c8ff, #6ee7ff);
        box-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
        transition: width 60ms linear;
      }
      #explosion-label { font-size: 10px; margin-top: 4px; letter-spacing: 2px; color: #5fb9d8; }

      /* Model picker */
      #model-picker {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #model-picker select, #model-picker button {
        background: rgba(4, 12, 24, 0.75);
        border: 1px solid rgba(0, 200, 255, 0.45);
        color: #9fdcff;
        font-family: inherit;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        outline: none;
      }
      #model-picker select:hover, #model-picker button:hover {
        border-color: #6ee7ff;
        box-shadow: 0 0 12px rgba(0, 200, 255, 0.35);
      }

      /* Drag & drop overlay */
      #drop-overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 40, 70, 0.5);
        border: 2px dashed rgba(0, 200, 255, 0.7);
        font-size: 20px;
        letter-spacing: 4px;
        color: #6ee7ff;
        pointer-events: none;
      }
      #drop-overlay.visible { display: flex; }

      /* Cursor láser (apuntado con el índice) */
      #laser-cursor {
        position: absolute;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border: 2px solid #00d4ff;
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(0, 212, 255, 0.9), inset 0 0 6px rgba(0, 212, 255, 0.6);
        pointer-events: none;
        z-index: 30;
        display: none;
      }
      #laser-cursor.visible { display: block; }

      /* Panel de información técnica */
      #info-panel {
        position: absolute;
        right: 16px;
        top: 16px;
        z-index: 15;
        width: 300px;
        background: rgba(4, 12, 24, 0.8);
        border: 1px solid rgba(255, 193, 77, 0.5);
        border-radius: 8px;
        padding: 14px 18px;
        backdrop-filter: blur(6px);
        box-shadow: 0 0 18px rgba(255, 193, 77, 0.2);
        display: none;
      }
      #info-panel.visible { display: block; }
      #info-panel h2 {
        font-size: 13px;
        letter-spacing: 2px;
        color: #ffc14d;
        text-shadow: 0 0 8px rgba(255, 193, 77, 0.6);
        margin-bottom: 10px;
        word-break: break-all;
      }
      #info-panel .info-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        margin: 5px 0;
        letter-spacing: 1px;
      }
      #info-panel .info-key { color: #5fb9d8; flex-shrink: 0; }
      #info-panel .info-value { color: #e6fbff; text-align: right; word-break: break-word; }
      #info-panel .info-empty {
        font-size: 11px;
        letter-spacing: 2px;
        color: #7a8fa0;
        text-align: center;
        padding: 8px 0;
      }

      /* Mensajes de estado (cámara, carga) */
      #status-message {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        background: rgba(4, 12, 24, 0.85);
        border: 1px solid rgba(0, 200, 255, 0.45);
        border-radius: 8px;
        padding: 16px 24px;
        font-size: 13px;
        letter-spacing: 2px;
        display: none;
        text-align: center;
        max-width: 420px;
      }
      #status-message.visible { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="video-preview" width="480" height="360"></canvas>

      <div id="hud">
        <div class="panel">
          <h1>J.A.R.V.I.S // EXPLODED VIEW</h1>
          <div class="row"><span>MANOS</span><span class="value" id="hud-hands">0</span></div>
          <div class="row"><span>GESTO</span><span class="value" id="hud-gesture">—</span></div>
          <div class="row"><span>PIEZA</span><span class="value" id="hud-piece">—</span></div>
          <div class="row"><span>MODELO</span><span class="value" id="hud-model">—</span></div>
          <div id="explosion-bar"><div id="explosion-fill"></div></div>
          <div id="explosion-label">NIVEL DE EXPLOSIÓN</div>
        </div>
      </div>

      <div id="model-picker">
        <select id="model-select"></select>
        <button id="load-file-btn">CARGAR GLB…</button>
        <input id="file-input" type="file" accept=".glb,.gltf" style="display:none" />
      </div>

      <div id="laser-cursor"></div>

      <div id="info-panel">
        <h2 id="info-title">PIEZA</h2>
        <div id="info-body"></div>
      </div>

      <div id="drop-overlay">SUELTA EL ARCHIVO GLB</div>
      <div id="status-message"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
